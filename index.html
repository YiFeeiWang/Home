<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Visited UNESCO World Heritages</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f0f0;
        }
        #map {
            width: 80vw;
            height: 80vh;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        .heritage-icon {
            font-size: 28px;
            line-height: 28px;
            text-align: center;
        }
        .heritage-partial {
            opacity: 0.6;
        }

        .heritage-legend {
            background: white;
            padding: 10px 14px;
            font-size: 14px;
            line-height: 20px;
            border-radius: 6px;
            box-shadow: 0 0 6px rgba(0,0,0,0.25);
        }

        .legend-icon {
            font-size: 20px;
            margin-right: 6px;
        }

        .legend-partial {
            opacity: 0.5;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script src="whc-sites-2025.js"></script>

<script>
    const map = L.map('map').setView([20, 0], 2);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const oldVisit = "before 2024"
    const visitedHeritage = {
        "Temple and Cemetery of Confucius and the Kong Family Mansion in Qufu": {
            date: oldVisit
        },
        "Beijing Central Axis: A Building Ensemble Exhibiting the Ideal Order of the Chinese Capital": {
            date: oldVisit,
        },
        "Classical Gardens of Suzhou": {
            date: oldVisit
        },
        "Imperial Palaces of the Ming and Qing Dynasties in Beijing and Shenyang": {
            date: oldVisit + ' (Beijing)',
            type: "partial",
            coordinates: [
                "N39 55 1.62",
                "E116 23 49.74"
            ]
        },
        "Historic Monuments of Dengfeng in “The Centre of Heaven and Earth”": {
            date: oldVisit + ' (Shaolin Temple)',
            type: "partial"
        },
        "Imperial Tombs of the Ming and Qing Dynasties": {
            date: '2024-06' + ' (Ming Tombs)',
            type: "partial",
            coordinates: [
                "N40 16 10.40",
                "E116 14 40.60"
            ]
        },
        "Longmen Grottoes": {
            date: oldVisit
        },
        "Mausoleum of the First Qin Emperor": {
            date: oldVisit
        },
        "Mount Qingcheng and the Dujiangyan Irrigation System": {
            date: oldVisit + ' (Dujiangyan)',
            type: "partial"
        },
        "Mount Wutai": {
            date: "2024-08"
        },
        "Silk Roads: the Routes Network of Chang'an-Tianshan Corridor": {
            date: oldVisit + ' (Xi\'an, Luoyang), 2024-06 (Bin County Cave Temple)',
            type: "partial",
            coordinates: [
                "N34 13 11",
                "E108 57 34"
            ]
        },
        "Summer Palace, an Imperial Garden in Beijing": {
            date: oldVisit
        },
        "Temple of Heaven: an Imperial Sacrificial Altar in Beijing": {
            date: oldVisit
        },
        "The Grand Canal": {
            date: oldVisit,
            type: "partial",
            coordinates: [
                "N35 4 40",
                "E116 41 50"
            ]
        },
        "The Great Wall": {
            date: oldVisit +  ' (Badaling)',
            type: "partial",
            coordinates: [
                "N40 21 0.00",
                "E116 1 0.00"
            ]
        },
        "West Lake Cultural Landscape of Hangzhou": {
            date: oldVisit
        },
        "Yin Xu": {
            date: "2024-03"
        },
        "Yungang Grottoes": {
            date: "2024-04"
        },
        "Mount Taishan":{
            date: oldVisit
        },
        "Historic Areas of Istanbul":{
            date: "2025-02"
        },
        "Historic Centre of Rome, the Properties of the Holy See in that City Enjoying Extraterritorial Rights and San Paolo Fuori le Mura":{
            date: "2025-02",
            type: "partial"
        },       
        "Villa Adriana (Tivoli)":{
            date: "2025-02"
        },     
        "Villa d\'Este, Tivoli":{
            date: "2025-02"
        },
        "Strasbourg, Grande-Île and <em>Neustadt</em>":{
            date: "2024-11 (Grande-Île)",
            type: "partial"
        },
        "Vatican City":{
            date: "2025-02"
        },
        "Historic Centre of Vienna":{
            date: "2025-04"
        },
        "Palace and Gardens of Schönbrunn":{
            date: "2025-04"
        },
        "Abbey of St Gall":{
            date: "2025-04"
        },
        "Old City of Berne":{
            date: "2025-11"
        },
        "Three Castles, Defensive Wall and Ramparts of the Market-Town of Bellinzona":{
            date: "2025-06"
        },
        "Aachen Cathedral":{
            date: "2024-12"
        },
        "Cologne Cathedral":{
            date: "2024-12"
        },
        "Maulbronn Monastery Complex":{
            date: "2024-12"
        },
        "Roman Monuments, Cathedral of St Peter and Church of Our Lady in Trier":{
            date: "2024-12"
        },
        "Speyer Cathedral":{
            date: "2024-12"
        },
        "Monastic Island of Reichenau":{
            date: "2025-04"
        },
        "Museumsinsel (Museum Island), Berlin":{
            date: "2024-12 (Neues Museum, Alte Nationalgalerie), 2026-04 (Bode-Museum, Altes Museum)",
            type: "partial"
        },
        "Venetian Works of Defence between the 16th and 17th Centuries: <em>Stato da Terra</em> – Western <em>Stato da Mar</em>":{
            date: "2025-12 (Bergamo)",
            type: "partial",
            coordinates: [
                "N45 42 12",
                "E9 39 49"
            ]
        },
        "Longobards in Italy. Places of the Power (568-774 A.D.)":{
            date: "2025-12 (Brescia)",
            type: "partial",
            coordinates: [
                "N45 32 23",
                "E10 13 34"
            ]
        },
        "Mantua and Sabbioneta":{
            date: "2026-01"
        },   
        "The Maison Carrée of Nîmes":{
            date: "2026-03"
        },              
        "Roman Theatre and its Surroundings and the \"Triumphal Arch\" of Orange":{
            date: "2026-03"
        },
        "Arles, Roman and Romanesque Monuments":{
            date: "2026-03"
        },        
        "Pont du Gard (Roman Aqueduct)":{
            date: "2026-03"
        },      
        "Historic Centre of Avignon: Papal Palace, Episcopal Ensemble and Avignon Bridge":{
            date: "2026-03"
        },
        "Early Christian Monuments of Ravenna":{
            date: "2026-04"
        },
        "The Porticoes of Bologna":{
            date: "2026-04"
        },
        "Cathedral, Torre Civica and Piazza Grande, Modena":{
            date: "2026-04"
        },
        "Church and Dominican Convent of Santa Maria delle Grazie with “The Last Supper” by Leonardo da Vinci":{
            date: "2026-04"
        },
        "Naumburg Cathedral":{
            date: "2026-04"
        },
        "Collegiate Church, Castle and Old Town of Quedlinburg":{
            date: "2026-04"
        },
        "Palaces and Parks of Potsdam and Berlin":{
            date: "2026-05"
        },
        "Paphos":{
            date: "2026-06"
        },
        "Benedictine Convent of St John at Müstair":{
            date: "2026-06"
        },
        "Rhaetian Railway in the Albula / Bernina Landscapes":{
            date: "2026-06 (Albula Line)",
            type: "partial"
        },
        "Padua’s fourteenth-century fresco cycles":{
            date: "2026-08",
        },
        "City of Vicenza and the Palladian Villas of the Veneto":{
            date: "2026-08",
        },
        "Ferrara, City of the Renaissance, and its Po Delta":{
            date: "2026-08",
        },
        "City of Verona":{
            date: "2026-08",
        },
    };

    const iconCultural = L.divIcon({
        html: '🏛️',
        className: 'heritage-icon',
        iconSize: [32, 32],
        iconAnchor: [16, 16],
        popupAnchor: [0, -18]
    });

    const iconNatural = L.divIcon({
        html: '🌲',
        className: 'heritage-icon',
        iconSize: [32, 32],
        iconAnchor: [16, 16],
        popupAnchor: [0, -18]
    });

    const iconMixed = L.divIcon({
        html: '🚞',
        className: 'heritage-icon',
        iconSize: [32, 32],
        iconAnchor: [16, 16],
        popupAnchor: [0, -18]
    });

    const iconPartial = L.divIcon({
        html: '🚧',
        className: 'heritage-icon heritage-partial',
        iconSize: [32, 32],
        iconAnchor: [16, 16],
        popupAnchor: [0, -18]
    });

    function getIconFromCategory(category) {
        if (category === "Natural") return iconNatural;
        if (category === "Mixed") return iconMixed;
        return iconCultural;
    }

    const markers = [];

    function dmsToDecimal(value) {
        if (typeof value === 'number') {
            return value;
        }

        if (typeof value !== 'string') {
            return NaN;
        }

        let str = value.trim().toUpperCase();
        if (!str) return NaN;

        if (!/^[NSEW]/.test(str[0])) {
            const num = parseFloat(str);
            return Number.isFinite(num) ? num : NaN;
        }

        const direction = str[0];
        const rest = str.slice(1).trim();

        const parts = rest.split(/[^\d.]+/).filter(Boolean);

        const deg = parseFloat(parts[0] || '0');
        const min = parseFloat(parts[1] || '0');
        const sec = parseFloat(parts[2] || '0');

        if (!Number.isFinite(deg) || !Number.isFinite(min) || !Number.isFinite(sec)) {
            return NaN;
        }

        let decimal = deg + min / 60 + sec / 3600;

        if (direction === 'S' || direction === 'W') {
            decimal = -decimal;
        }

        return decimal;
    }

    heritageData.forEach(row => {
        const nameEn = (row.name_en || '').trim();
        if (!(nameEn in visitedHeritage)) return;

        const info = visitedHeritage[nameEn];

    let lat, lng;

    if (info.coordinates && Array.isArray(info.coordinates) && info.coordinates.length === 2) {
        lat = dmsToDecimal(info.coordinates[0]);
        lng = dmsToDecimal(info.coordinates[1]);
    } else {
        lat = parseFloat(row.latitude);
        lng = parseFloat(row.longitude);
    }

    if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

        const date = info.date;
        const category = row.category;

        const type = info.type || category.toLowerCase();
        const icon = info.type === "partial"
            ? iconPartial
            : getIconFromCategory(category);

        let popup = `<b>${nameEn}</b><br>Visited: ${date}`;
        if (info.type === "partial") popup += `<br>Partially visited. To be further explored...`;

        const marker = L.marker([lat, lng], { icon })
            .addTo(map)
            .bindPopup(popup);

        markers.push(marker);
    });


    if (markers.length > 0) {
        const group = L.featureGroup(markers);
        map.fitBounds(group.getBounds().pad(0.2));
    }

    const legend = L.control({ position: "bottomright" });

    legend.onAdd = function (map) {
        const div = L.DomUtil.create("div", "heritage-legend");
        div.innerHTML = `
            <div><span class="legend-icon">🏛️</span> Cultural</div>
            <div><span class="legend-icon">🌲</span> Natural</div>
            <div><span class="legend-icon">🚞</span> Mixed</div>
            <div><span class="legend-icon legend-partial">🚧</span> Partial visit</div>
        `;
        return div;
    };

    legend.addTo(map);
</script>

</body>
</html>
